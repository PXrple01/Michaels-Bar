[build]
  command = "npm run build"
  publish = "dist/web"

[functions]
  node_bundler = "esbuild"

# Der Spielleiter (/api/campaign/*) ist eine eigene Streaming-Funktion (netlify/functions/gm.ts).
# Alle übrigen API-Pfade gehen an die normale API-Funktion.
[[redirects]]
  from = "/api/rules"
  to = "/.netlify/functions/api/rules"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/api/config"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/api/characters"
  to = "/.netlify/functions/api/characters"
  status = 200

[[redirects]]
  from = "/api/rolls/*"
  to = "/.netlify/functions/api/rolls/:splat"
  status = 200

[[redirects]]
  from = "/api/rolls"
  to = "/.netlify/functions/api/rolls"
  status = 200
