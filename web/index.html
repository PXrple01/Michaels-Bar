<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07050c" />
    <meta name="color-scheme" content="dark" />
    <title>Michaels Bar</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <canvas id="bg-embers" aria-hidden="true"></canvas>
    <div class="bg-nebula" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="bg-grain" aria-hidden="true"></div>
    <div id="cursor-glow" aria-hidden="true"></div>

    <header class="topbar" id="topbar"></header>
    <main id="app" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Hauptnavigation"></nav>

    <div id="dice-overlay" class="dice-overlay" hidden></div>
    <div id="modal-root"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="tooltip" role="tooltip" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
